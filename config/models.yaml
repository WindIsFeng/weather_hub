version: 1
controller_jobs_dir: ../runs

targets:
  local:
    kind: local
    jobs_dir: ../runs
    conda_executable: conda
    models:
      pangu:
        project_dir: ../../pangu-weather
        conda_env: pangu
        module: pangu_weather
        base_config: configs/default.yaml
        device_id: 0
      fengwu:
        project_dir: ../../fengwu
        conda_env: fengwu
        module: fengwu_weather
        base_config: configs/default.yaml
        device_id: 0
      fuxi:
        project_dir: ../../fuxi
        conda_env: fuxi
        module: fuxi_weather
        base_config: configs/default.yaml
        device_id: 0
      graphcast:
        project_dir: ../../graphcast
        conda_env: graphcast
        module: graphcast_weather
        base_config: configs/default.yaml
        device_id: 0
      aurora:
        project_dir: ../../aurora
        conda_env: aurora
        module: aurora_weather
        base_config: configs/default.yaml
        device_id: 0

